<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#4338ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="card-grad" x1="40" y1="30" x2="440" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <rect width="480" height="240" rx="16" fill="url(#bg-grad)" />
  <circle cx="90" cy="50" r="60" fill="#6366f1" fill-opacity="0.12" filter="blur(20px)" />
  <circle cx="390" cy="180" r="70" fill="#06b6d4" fill-opacity="0.12" filter="blur(25px)" />

  <!-- Main Code/UI Window -->
  <rect x="50" y="30" width="380" height="180" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Window Header -->
  <line x1="50" y1="62" x2="430" y2="62" stroke="#334155" stroke-width="1" />
  <circle cx="72" cy="46" r="4" fill="#f43f5e" />
  <circle cx="86" cy="46" r="4" fill="#eab308" />
  <circle cx="100" cy="46" r="4" fill="#22c55e" />
  <rect x="130" y="40" width="120" height="12" rx="4" fill="#334155" fill-opacity="0.6" />

  <!-- Code Wireframe Left Column -->
  <rect x="70" y="80" width="80" height="8" rx="3" fill="#818cf8" fill-opacity="0.8" />
  <rect x="70" y="96" width="140" height="6" rx="3" fill="#64748b" fill-opacity="0.5" />
  <rect x="90" y="110" width="110" height="6" rx="3" fill="#64748b" fill-opacity="0.4" />
  <rect x="90" y="124" width="130" height="6" rx="3" fill="#38bdf8" fill-opacity="0.6" />
  <rect x="70" y="140" width="60" height="6" rx="3" fill="#64748b" fill-opacity="0.5" />

  <!-- Interactive Component Preview Right Card -->
  <rect x="250" y="78" width="160" height="114" rx="8" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1" />
  <rect x="264" y="92" width="70" height="7" rx="3" fill="#e2e8f0" />
  <rect x="264" y="105" width="110" height="5" rx="2" fill="#94a3b8" />
  
  <!-- Mini Button in Preview -->
  <rect x="264" y="122" width="64" height="20" rx="5" fill="url(#accent-grad)" />
  <rect x="278" y="130" width="36" height="4" rx="2" fill="#ffffff" />
  
  <!-- Mini Input in Preview -->
  <rect x="264" y="150" width="132" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <rect x="272" y="157" width="40" height="4" rx="2" fill="#64748b" />

  <!-- Floating Badge Left -->
  <g transform="translate(30, 150)">
    <rect width="90" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22c55e" />
    <rect x="24" y="10" width="50" height="6" rx="2" fill="#c7d2fe" />
  </g>

  <!-- Floating Badge Right -->
  <g transform="translate(365, 45)">
    <rect width="85" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <rect x="24" y="10" width="45" height="6" rx="2" fill="#bae6fd" />
  </g>
</svg>
